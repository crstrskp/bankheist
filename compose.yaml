name: bankheist

services:
  bankheist-game:
    build: .
    restart: unless-stopped
    environment:
      GAME_PORT: "7070"
      WEBHOOK_URL: http://leaderboard:7071/webhooks/round-ended
      TEACHER_KEY: ${TEACHER_KEY:?Set TEACHER_KEY in .env}
      ALARM_ENABLED: ${ALARM_ENABLED:-true}
    networks:
      - caddy
      - backend
    depends_on:
      leaderboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://localhost:7070/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  leaderboard:
    build: .
    command: ["dk.bankheist.LeaderboardServer"]
    restart: unless-stopped
    environment:
      LEADERBOARD_PORT: "7071"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://localhost:7071/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:?Set CADDY_NETWORK to an existing network used by Caddy}
  backend:
    internal: true
